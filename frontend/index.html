<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Smart Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Secure Smart Home Dashboard</h1>

  <section id="authPanel">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="usernameInput">Username</label>
      <input id="usernameInput" type="text" name="username" required>

      <label for="passwordInput">Password</label>
      <input id="passwordInput" type="password" name="password" required>

      <button type="submit">Sign In</button>
    </form>
    <p id="loginMessage"></p>
  </section>


  <section id="dashboardPanel" hidden>
    <div>
      <p id="currentUser"></p>
      <button id="logoutButton" type="button">Log Out</button>
    </div>
    <p id="status">Checking system status...</p>

    <p>Total Events: <span id="totalEvents">0</span></p>
    <p>Door Events: <span id="doorEvents">0</span></p>
    <p>Motion Events: <span id="motionEvents">0</span></p>

  <section id="adminPanel" hidden>
    <h2>User Management</h2>

    <p id="adminMessage"></p>

    <button id="refreshUsersButton" type="button">
      Refresh Users
    </button>

    <ul id="userList"></ul>
  </section>

    <h2>Recent Events</h2>
    <label for="sensorFilter">Show:</label>
    <select id="sensorFilter">
      <option value="all">All events</option>
      <option value="door">Door events</option>
      <option value="motion">Motion events</option>
    </select>
    
    <button id="refreshButton">Refresh Events</button>

    <ul id="eventList"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
